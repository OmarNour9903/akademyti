<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <title>أكاديميتي</title>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><i class="bi bi-mortarboard-fill"></i> <span id="tenantName" data-i18n="brand">أكاديميتي</span></div>
      <nav class="nav flex-column py-2" id="sideNav">
        <a href="#dashboard" class="nav-link active" data-view="dashboard"><i class="bi bi-speedometer2"></i><span data-i18n="dashboard">لوحة التحكم</span></a>
        <a href="#courses" class="nav-link" data-view="courses"><i class="bi bi-journal-bookmark"></i><span data-i18n="courses">الكورسات</span></a>
        <a href="#students" class="nav-link" data-view="students"><i class="bi bi-people"></i><span data-i18n="students">الطلاب</span></a>
        <a href="#instructors" class="nav-link" data-view="instructors"><i class="bi bi-person-video3"></i><span data-i18n="instructors">المحاضرين</span></a>
        <a href="#finance" class="nav-link" data-view="finance"><i class="bi bi-cash-coin"></i><span data-i18n="finance">الحسابات</span></a>
        <a href="#employees" class="nav-link" data-view="employees"><i class="bi bi-person-badge"></i><span data-i18n="employees">الموظفين</span></a>
        <a href="#settings" class="nav-link" data-view="settings"><i class="bi bi-gear"></i><span data-i18n="settings">الإعدادات</span></a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <button id="menuBtn" class="btn btn-light d-lg-none" aria-label="menu"><i class="bi bi-list"></i></button>
        <input id="searchBox" class="form-control search" data-i18n-ph="search_code" placeholder="ابحث بالكود أو الاسم...">
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="text-muted small d-none d-md-inline"><span data-i18n="welcome">أهلاً</span>، <span id="userName"></span></span>
          <button id="langBtn" class="btn btn-light btn-sm" data-i18n="lang">English</button>
          <button id="logoutBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> <span data-i18n="logout">خروج</span></button>
        </div>
      </header>
      <main class="content">
        <section id="view-dashboard" class="view">
          <h1 class="h4 fw-bold mb-4" data-i18n="dashboard">لوحة التحكم</h1>
          <div class="row g-3">
            <div class="col-md-4">
              <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
                <div class="stat-icon c1"><i class="bi bi-people-fill"></i></div>
                <div><div class="text-muted small" data-i18n="total_trainees">إجمالي المتدربين</div><div class="stat-value" id="statTotal">-</div></div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
                <div class="stat-icon c2"><i class="bi bi-person-check-fill"></i></div>
                <div><div class="text-muted small" data-i18n="current_trainees">متدربين في كورسات حالية</div><div class="stat-value" id="statCurrent">-</div></div>
              </div>
            </div>
            <div class="col-md-4">
              <div class="card stat-card p-3 d-flex flex-row align-items-center gap-3">
                <div class="stat-icon c3"><i class="bi bi-journal-check"></i></div>
                <div><div class="text-muted small" data-i18n="available_courses">الكورسات المتاحة</div><div class="stat-value" id="statCourses">-</div></div>
              </div>
            </div>
          </div>
        </section>
        <section id="view-placeholder" class="view d-none">
          <div class="card card-soft p-5 text-center text-muted">
            <i class="bi bi-cone-striped fs-1 mb-2"></i>
            <p class="mb-0" data-i18n="coming_soon">الجزء ده هيتبني في المرحلة الجاية.</p>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>

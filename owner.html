<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261126225437">
  <title>أكاديميتي | مالك المنصة</title>
</head>
<body>
  <nav class="topbar">
    <span class="fw-bold text-brand fs-5"><i class="bi bi-mortarboard-fill"></i> <span data-i18n="brand">أكاديميتي</span></span>
    <span class="text-muted" data-i18n="owner_console">لوحة مالك المنصة</span>
    <div class="ms-auto d-flex gap-2">
      <button id="langBtn" class="btn btn-light btn-sm" data-i18n="lang">English</button>
      <button id="logoutBtn" class="btn btn-outline-danger btn-sm"><i class="bi bi-box-arrow-right"></i> <span data-i18n="logout">خروج</span></button>
    </div>
  </nav>
  <main class="content container-xl">
    <div class="row g-4">
      <div class="col-lg-4">
        <div class="card card-soft p-4">
          <h2 class="h5 fw-bold mb-3" data-i18n="new_academy">أكاديمية جديدة</h2>
          <div id="alertBox" class="alert d-none" role="alert"></div>
          <form id="tenantForm" novalidate>
            <div class="mb-3">
              <label for="tName" class="form-label" data-i18n="academy_name">اسم الأكاديمية</label>
              <input id="tName" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="aName" class="form-label" data-i18n="admin_name">اسم مدير النظام</label>
              <input id="aName" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="aEmail" class="form-label" data-i18n="admin_email">إيميل مدير النظام</label>
              <input id="aEmail" type="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="aPass" class="form-label" data-i18n="admin_password">كلمة مرور مبدئية</label>
              <input id="aPass" type="text" class="form-control" minlength="6" autocomplete="off" required>
            </div>
            <button id="createBtn" type="submit" class="btn btn-brand w-100" data-i18n="create">إنشاء</button>
          </form>
        </div>
      </div>
      <div class="col-lg-8">
        <div class="card card-soft p-4">
          <h2 class="h5 fw-bold mb-3" data-i18n="academies">الأكاديميات</h2>
          <div class="table-responsive">
            <table class="table align-middle mb-0">
              <thead><tr><th data-i18n="academy_name">اسم الأكاديمية</th><th data-i18n="admin_email">إيميل المدير</th><th data-i18n="status">الحالة</th><th data-i18n="created_at">تاريخ الإنشاء</th><th></th></tr></thead>
              <tbody id="tenantRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script type="module" src="js/owner.js?v=20261126225437"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172B3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أكاديميتي">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261128075446">
  <title>أكاديميتي | تسجيل الدخول</title>
</head>
<body>
  <button id="langBtn" class="btn btn-light btn-sm lang-switch" data-i18n="lang">English</button>
  <div class="auth-wrap">
    <aside class="auth-side">
      <img src="img/logo.svg" alt="" class="auth-logo">
      <h2 data-i18n="auth_headline">كل طالب وكورس ومحاضر ليه كود، وكل جنيه ليه إيصال.</h2>
      <p data-i18n="auth_sub">منصة لإدارة أكاديميات الكورسات: المجموعات، والطلاب، والأقساط، والخزن، والصلاحيات.</p>
      <div class="ticket-demo"><span class="code-chip">STD-00125</span><span class="code-chip">CRS-0007-G03</span><span class="code-chip">TRX-2026-000341</span></div>
    </aside>
    <main class="auth-main">
      <div class="auth-card">
        <img src="img/logo.svg" alt="" class="auth-logo d-lg-none">
        <h1 class="h3 fw-bold mb-1" data-i18n="login_title">تسجيل الدخول</h1>
        <p class="text-muted mb-4"><span data-i18n="brand">أكاديميتي</span> — <span data-i18n="tagline">نظام إدارة الأكاديميات</span></p>
        <div id="alertBox" class="alert d-none" role="alert"></div>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label" data-i18n="email">البريد الإلكتروني</label>
            <input id="email" type="email" class="form-control" autocomplete="username" inputmode="email" dir="ltr" required>
          </div>
          <div class="mb-3">
            <label for="password" class="form-label" data-i18n="password">كلمة المرور</label>
            <input id="password" type="password" class="form-control" autocomplete="current-password" dir="ltr" required>
          </div>
          <button id="loginBtn" type="submit" class="btn btn-brand w-100 py-2" data-i18n="login">دخول</button>
        </form>
        <button id="forgotBtn" type="button" class="btn btn-link w-100 mt-2" data-i18n="forgot">نسيت كلمة المرور؟</button>
      </div>
    </main>
  </div>
  <script type="module" src="js/login.js?v=20261128075446"></script>
</body>
</html>

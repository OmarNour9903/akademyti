<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172B3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="أكاديميتي">
  <link rel="icon" type="image/svg+xml" href="img/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261126233856">
  <title>أكاديميتي</title>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand"><img src="img/logo.svg" alt=""> <span id="tenantName" data-i18n="brand">أكاديميتي</span></div>
      <nav class="nav flex-column py-2" id="sideNav">
        <a href="#dashboard" class="nav-link" data-view="dashboard"><i class="bi bi-speedometer2"></i><span data-i18n="dashboard">لوحة التحكم</span></a>
        <a href="#courses" class="nav-link" data-view="courses" data-perm="courses"><i class="bi bi-journal-bookmark"></i><span data-i18n="courses">الكورسات</span></a>
        <a href="#groups" class="nav-link" data-view="groups" data-perm="groups"><i class="bi bi-collection"></i><span data-i18n="groups">المجموعات</span></a>
        <a href="#students" class="nav-link" data-view="students" data-perm="students"><i class="bi bi-people"></i><span data-i18n="students">الطلاب</span></a>
        <a href="#instructors" class="nav-link" data-view="instructors" data-perm="instructors"><i class="bi bi-person-video3"></i><span data-i18n="instructors">المحاضرين</span></a>
        <a href="#finance" class="nav-link" data-view="finance" data-perm-any="payments,enrollments,expenses"><i class="bi bi-cash-coin"></i><span data-i18n="finance">الحسابات</span></a>
        <div class="nav-section" data-i18n="administration">الإدارة</div>
        <a href="#departments" class="nav-link" data-view="departments" data-admin="1"><i class="bi bi-diagram-3"></i><span data-i18n="departments">الأقسام</span></a>
        <a href="#employees" class="nav-link" data-view="employees" data-admin="1"><i class="bi bi-person-badge"></i><span data-i18n="employees">الموظفين</span></a>
        <a href="#audit" class="nav-link" data-view="audit" data-perm="auditLog"><i class="bi bi-clock-history"></i><span data-i18n="audit_log">سجل النشاط</span></a>
        <a href="#trash" class="nav-link" data-view="trash" data-admin="1"><i class="bi bi-trash3"></i><span data-i18n="trash">سلة المهملات</span></a>
        <a href="#settings" class="nav-link" data-view="settings" data-admin="1"><i class="bi bi-gear"></i><span data-i18n="settings">الإعدادات</span></a>
      </nav>
    </aside>
    <div class="main">
      <header class="topbar">
        <a href="#dashboard" class="mobile-brand" aria-label="home"><img src="img/logo.svg" alt=""></a>
        <div class="search-wrap"><i class="bi bi-search"></i><input id="searchBox" type="search" class="form-control search" data-i18n-ph="search_code" placeholder="ابحث بالكود أو الاسم..." autocomplete="off" enterkeyhint="search"><div id="searchResults" class="search-results d-none"></div></div>
        <div class="ms-auto d-flex align-items-center gap-2">
          <span class="user-chip d-none d-md-flex"><span class="avatar" id="userInitial"></span><span class="name"><span id="userName"></span> <span id="roleBadge" class="badge text-bg-light"></span></span></span>
          <button id="viewAsBtn" class="btn btn-light btn-icon d-none" data-i18n-title="view_as" title="عرض بعين قسم أو موظف" aria-label="view as"><i class="bi bi-eye"></i></button>
          <button id="langBtn" class="btn btn-light btn-icon fw-semibold" data-i18n="lang_short" data-i18n-title="lang" title="English">EN</button>
          <button id="logoutBtn" class="btn btn-light btn-icon text-danger" data-i18n-title="logout" title="خروج" aria-label="logout"><i class="bi bi-box-arrow-right"></i></button>
        </div>
      </header>
      <div id="previewBar" class="preview-bar d-none">
        <i class="bi bi-eye-fill"></i> <span data-i18n="previewing_as">بتشوف السيستم بعين:</span> <b id="previewName"></b>
        <span class="small opacity-75" data-i18n="preview_note">(معاينة بس — مفيش أي تعديل هيتحفظ)</span>
        <button id="exitPreview" class="btn btn-sm btn-light ms-auto" data-i18n="exit_preview">خروج من المعاينة</button>
      </div>
      <main class="content" id="viewRoot"></main>
    </div>
  </div>

  <div class="modal fade" id="appModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable modal-lg modal-fullscreen-sm-down" id="appModalDialog">
      <form class="modal-content" id="appModalForm" novalidate>
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="appModalTitle"></h5>
          <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="close"></button>
        </div>
        <div class="modal-body" id="appModalBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-light" data-bs-dismiss="modal" data-i18n="cancel">إلغاء</button>
          <button type="submit" class="btn btn-brand" id="appModalSubmit"></button>
        </div>
      </form>
    </div>
  </div>
  <nav class="bottom-nav" id="bottomNav">
    <a href="#dashboard" data-view="dashboard"><i class="bi bi-speedometer2"></i><span data-i18n="nav_home">الرئيسية</span></a>
    <a href="#students" data-view="students" data-perm="students"><i class="bi bi-people"></i><span data-i18n="students">الطلاب</span></a>
    <a href="#groups" data-view="groups" data-perm="groups"><i class="bi bi-collection"></i><span data-i18n="groups">المجموعات</span></a>
    <a href="#finance" data-view="finance" data-perm-any="payments,enrollments,expenses"><i class="bi bi-cash-coin"></i><span data-i18n="finance">الحسابات</span></a>
    <button type="button" id="moreBtn"><i class="bi bi-grid"></i><span data-i18n="nav_more">المزيد</span></button>
  </nav>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <div id="toastBox" class="toast-box" aria-live="polite"></div>
  <div id="printArea" class="print-area"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js?v=20261126233856"></script>
</body>
</html>

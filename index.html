<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link id="bs-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css?v=20261126224220">
  <title>أكاديميتي | تسجيل الدخول</title>
</head>
<body>
  <button id="langBtn" class="btn btn-light btn-sm lang-switch" data-i18n="lang">English</button>
  <div class="auth-wrap">
    <div class="card auth-card p-4">
      <div class="auth-logo"><i class="bi bi-mortarboard-fill"></i></div>
      <h1 class="h4 text-center fw-bold mb-1" data-i18n="brand">أكاديميتي</h1>
      <p class="text-center text-muted mb-4" data-i18n="tagline">نظام إدارة الأكاديميات</p>
      <div id="alertBox" class="alert d-none" role="alert"></div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="email" class="form-label" data-i18n="email">البريد الإلكتروني</label>
          <input id="email" type="email" class="form-control" autocomplete="username" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label" data-i18n="password">كلمة المرور</label>
          <input id="password" type="password" class="form-control" autocomplete="current-password" required>
        </div>
        <button id="loginBtn" type="submit" class="btn btn-brand w-100 py-2" data-i18n="login">دخول</button>
      </form>
      <button id="forgotBtn" type="button" class="btn btn-link w-100 mt-2" data-i18n="forgot">نسيت كلمة المرور؟</button>
    </div>
  </div>
  <script type="module" src="js/login.js?v=20261126224220"></script>
</body>
</html>
